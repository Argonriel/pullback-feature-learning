[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pullback-feature-learning"
version = "0.1.0"
description = "A controlled study of damped representation pullback optimization and feature learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "threadpoolctl>=3.2,<4"]

[project.scripts]
pullback-pilot = "pullback_feature_learning.pilot:main"
pullback-verify = "pullback_feature_learning.verify:main"

[tool.setuptools.packages.find]
where = ["src"]
